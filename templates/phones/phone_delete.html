{% extends 'shared/base.html' %}
{% block content %}

<div style="max-width: 480px; margin: 4rem auto; text-align: center;">
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem;">
        <div style="width: 64px; height: 64px; background: rgba(248,113,113,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
            <i class="fa-solid fa-check" style="font-size: 1.5rem; color: var(--danger);"></i>
        </div>
        <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem;">Mark as sold?</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">
            This will remove <strong style="color: var(--text);">{{ phone.brand }} {{ phone.phone_model }}</strong> from all listings.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-check"></i> Yes, it's sold</button>
            </form>
            <a href="javascript:history.back()" class="btn btn-outline">Go back</a>
        </div>
    </div>
</div>

{% endblock %}
