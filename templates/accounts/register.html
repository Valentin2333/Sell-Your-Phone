{% extends 'shared/base.html' %}
{% block content %}

<div class="form-card">
    <h2>Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.25rem;">
            Sign up <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>
    <p>Already have an account? <a href="{% url 'log in user' %}">Log in</a></p>
</div>

{% endblock %}
